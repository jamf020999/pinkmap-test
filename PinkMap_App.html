<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PinkMap</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<style>
:root{--navy:#1f2f4d;--rose:#b5707f;--bg:#f7f5f0;--grey:#8a8f98;--line:#dcd9d2}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--navy)}
#panel{width:350px;padding:18px;overflow-y:auto;border-right:1px solid var(--line)}
#map{flex:1}
h1{margin:0 0 4px;font-size:28px}
h1 .pink{color:var(--rose)}
.sub{margin:0 0 14px;color:var(--grey);font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,button{width:100%;padding:10px;font-size:15px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--navy)}
input:focus{outline:2px solid var(--rose);outline-offset:1px}
.search-wrap{position:relative}
.suggestions{position:relative;background:white;border:1px solid var(--line);border-radius:8px;max-height:220px;overflow-y:auto;margin-top:4px;box-shadow:0 4px 12px #1f2f4d18}
.suggestion{width:100%;display:block;text-align:left;padding:10px 12px;background:white;color:var(--navy);border:0;border-radius:0;margin:0;cursor:pointer;font-size:14px}
.suggestion:hover,.suggestion:focus{background:#f3e8eb;color:var(--navy);outline:none}
.suggestion small{display:block;color:var(--grey);margin-top:3px}
.no-results{padding:10px;font-size:13px;color:var(--grey)}
[hidden]{display:none!important}
button{background:var(--navy);color:#fff;border:none;margin-top:16px;cursor:pointer}
button:hover{background:#2c4166}
#msg{margin-top:12px;font-size:14px}
.card{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;margin-top:12px;cursor:pointer}
.card.active{border-color:var(--rose);box-shadow:0 0 0 2px #b5707f33}
.card b{font-size:20px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;margin:0 4px 0 0;background:#eceae4}
.slow{background:#f3d9dd;color:#8a3b4a}
.fast{background:#d9ebe0;color:#2f6b45}
.small{font-size:13px;color:var(--grey);margin-top:6px}
@media(max-width:700px){body{flex-direction:column-reverse}#panel{width:100%;height:50%}#map{height:50%;flex:none}}
</style>
</head>
<body>
<div id="panel">
  <h1><span class="pink">Pink</span>Map</h1>
  <p class="sub">Find the calmer way to drive across Houston.</p>
  <label for="from">From</label>
  <div class="search-wrap"><input id="from" type="text" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="from-suggestions" placeholder="Search starting location..."><div id="from-suggestions" class="suggestions" role="listbox" hidden></div></div>
  <label for="to">To</label>
  <div class="search-wrap"><input id="to" type="text" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="to-suggestions" placeholder="Search destination..."><div id="to-suggestions" class="suggestions" role="listbox" hidden></div></div>
  <button id="go">Show routes</button>
  <div id="msg"></div>
  <div id="results"></div>
</div>
<div id="map"></div>

<script>
// Your Mapbox PUBLIC token (starts with pk.). Public tokens are meant to be used in web pages.
mapboxgl.accessToken = "pk.eyJ1IjoicGh1bmd1eWVubTI4NCIsImEiOiJjbXV5Zjk2dGUwMm1kMnlxNmh0Y2syMW1zIn0.X1G-HVr69xpo2OPlSB7KZA";

// [id, name, latitude, longitude] - taken from the team's OpenStreetMap places list
// Location records are loaded from data/locations.json; no need to edit this HTML to add places.
let PLACES = [];
let selectedFrom = null, selectedTo = null;
const fromSel = document.getElementById("from");
const toSel = document.getElementById("to");
const normalize = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const displayAddress = p => [p.address, p.city, p.state, p.zip].filter(Boolean).join(", ");

function installSearch(input, list, getSelected, setSelected) {
  let matches = [], focusIndex = -1;
  const close = () => { list.hidden = true; input.setAttribute("aria-expanded", "false"); focusIndex = -1; };
  const choose = p => { setSelected(p); input.value = p.place_name; close(); };
  const render = () => {
    const q = normalize(input.value);
    matches = q ? PLACES.filter(p => normalize(p.place_name).includes(q) || normalize(displayAddress(p)).includes(q)).slice(0, 8) : [];
    list.replaceChildren();
    focusIndex = -1;
    if (!q) { close(); return; }
    if (!matches.length) {
      const notice = document.createElement("div"); notice.className = "no-results";
      notice.textContent = "No matching saved locations"; list.append(notice);
    }
    matches.forEach((p, i) => {
      const opt = document.createElement("button"); opt.type = "button"; opt.className = "suggestion";
      opt.setAttribute("role", "option"); opt.id = input.id + "-result-" + i;
      const name = document.createElement("span"); name.textContent = p.place_name; opt.append(name);
      if (p.address) { const detail = document.createElement("small"); detail.textContent = displayAddress(p); opt.append(detail); }
      opt.addEventListener("mousedown", e => e.preventDefault());
      opt.addEventListener("click", () => choose(p)); list.append(opt);
    });
    list.hidden = false; input.setAttribute("aria-expanded", "true");
  };
  input.addEventListener("input", () => { setSelected(null); render(); });
  input.addEventListener("focus", () => { if (input.value && !getSelected()) render(); });
  input.addEventListener("keydown", e => {
    if (e.key === "Escape") { close(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (list.hidden) render();
      if (!matches.length) return;
      e.preventDefault(); focusIndex = (focusIndex + (e.key === "ArrowDown" ? 1 : -1) + matches.length) % matches.length;
      [...list.children].forEach((el, i) => { el.style.background = i === focusIndex ? "#f3e8eb" : ""; });
      input.setAttribute("aria-activedescendant", input.id + "-result-" + focusIndex);
    }
    if (e.key === "Enter" && !list.hidden && matches.length) {
      e.preventDefault(); choose(matches[focusIndex >= 0 ? focusIndex : 0]);
    }
  });
  input.addEventListener("blur", () => setTimeout(close, 140));
}
installSearch(fromSel, document.getElementById("from-suggestions"), () => selectedFrom, p => selectedFrom = p);
installSearch(toSel, document.getElementById("to-suggestions"), () => selectedTo, p => selectedTo = p);

async function loadLocations() {
  const msg = document.getElementById("msg");
  try {
    const response = await fetch("data/locations.json");
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("Expected a JSON array");
    PLACES = data.filter(p => p && p.place_name && Number.isFinite(Number(p.latitude)) && Number.isFinite(Number(p.longitude)) && Number(p.latitude) >= -90 && Number(p.latitude) <= 90 && Number(p.longitude) >= -180 && Number(p.longitude) <= 180);
    if (PLACES.length < 2) throw new Error("At least two valid locations are required");
    selectedFrom = PLACES[0]; selectedTo = PLACES[1];
    fromSel.value = selectedFrom.place_name; toSel.value = selectedTo.place_name;
    document.getElementById("go").disabled = false;
    msg.textContent = PLACES.length + " saved locations loaded.";
  } catch (err) {
    msg.textContent = "Could not load locations.json. Run PinkMap through a local HTTP server (see README). Details: " + err.message;
  }
}
document.getElementById("go").disabled = true;
loadLocations();

const map = new mapboxgl.Map({
  container: "map",
  style: "mapbox://styles/mapbox/light-v11",
  center: [-95.37, 29.76],
  zoom: 10
});
map.addControl(new mapboxgl.NavigationControl());


let routes = [], delays = [], markers = [], active = 0;

const mins = s => (s / 60).toFixed(1);

function statusOf(delay) {
  if (delay === null) return { text: "no typical time available", cls: "" };
  if (delay > 30) return { text: "slower than usual", cls: "slow" };
  if (delay < -30) return { text: "faster than usual", cls: "fast" };
  return { text: "about normal", cls: "" };
}

function clearMap() {
  routes.forEach((_, i) => {
    if (map.getLayer("route-" + i)) map.removeLayer("route-" + i);
    if (map.getSource("route-" + i)) map.removeSource("route-" + i);
  });
  markers.forEach(m => m.remove());
  markers = [];
}

function paint(i) {
  routes.forEach((_, j) => {
    if (!map.getLayer("route-" + j)) return;
    map.setPaintProperty("route-" + j, "line-color", j === i ? "#b5707f" : "#8a8f98");
    map.setPaintProperty("route-" + j, "line-width", j === i ? 7 : 4);
    map.setPaintProperty("route-" + j, "line-opacity", j === i ? 1 : 0.6);
  });
  if (map.getLayer("route-" + i)) map.moveLayer("route-" + i);
  document.querySelectorAll(".card").forEach((c, j) => c.classList.toggle("active", j === i));
  active = i;
}

function showCards(fastest, calmest) {
  const box = document.getElementById("results");
  box.innerHTML = "";
  routes.forEach((r, i) => {
    const st = statusOf(delays[i]);
    const miles = (r.distance / 1609.344).toFixed(1);
    const typical = r.duration_typical ? mins(r.duration_typical) + " min" : "n/a";
    const delayTxt = delays[i] === null ? "" : (delays[i] >= 0 ? "+" : "") + Math.round(delays[i]) + " sec vs usual";
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      (i === calmest && delays[i] !== null ? '<span class="tag fast">Least congested</span>' : "") +
      (i === fastest ? '<span class="tag">Fastest now</span>' : "") +
      '<div style="margin-top:6px"><b>' + mins(r.duration) + " min</b> &middot; " + miles + " mi</div>" +
      '<div class="small">Usually: ' + typical + " " + (delayTxt ? "(" + delayTxt + ")" : "") + "</div>" +
      '<div class="small"><span class="tag ' + st.cls + '">' + st.text + "</span></div>";
    card.onclick = () => paint(i);
    box.appendChild(card);
  });
}

async function showRoutes() {
  const msg = document.getElementById("msg");
  const a = selectedFrom, b = selectedTo;
  if (!a || !b) { msg.textContent = "Please select both locations from the suggestions."; return; }
  if (a.place_id === b.place_id) { msg.textContent = "Please pick two different places."; return; }
  msg.textContent = "Asking Mapbox...";
  document.getElementById("results").innerHTML = "";

  const url = "https://api.mapbox.com/directions/v5/mapbox/driving-traffic/" +
    a.longitude + "," + a.latitude + ";" + b.longitude + "," + b.latitude +
    "?alternatives=true&overview=full&geometries=geojson&access_token=" + mapboxgl.accessToken;

  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!data.routes || data.routes.length === 0) throw new Error(data.message || "No route found");

    clearMap();
    routes = data.routes;
    delays = routes.map(r => r.duration_typical ? r.duration - r.duration_typical : null);

    const fastest = 0; // Mapbox lists the fastest route first
    let calmest = fastest;
    delays.forEach((d, i) => { if (d !== null && (delays[calmest] === null || d < delays[calmest])) calmest = i; });

    routes.forEach((r, i) => {
      map.addSource("route-" + i, { type: "geojson", data: { type: "Feature", geometry: r.geometry } });
      map.addLayer({ id: "route-" + i, type: "line", source: "route-" + i,
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": "#8a8f98", "line-width": 4 } });
    });

    markers.push(new mapboxgl.Marker({ color: "#1f2f4d" }).setLngLat([Number(a.longitude), Number(a.latitude)]).setPopup(new mapboxgl.Popup().setText(a.place_name)).addTo(map));
    markers.push(new mapboxgl.Marker({ color: "#b5707f" }).setLngLat([Number(b.longitude), Number(b.latitude)]).setPopup(new mapboxgl.Popup().setText(b.place_name)).addTo(map));

    const bounds = new mapboxgl.LngLatBounds();
    routes.forEach(r => r.geometry.coordinates.forEach(c => bounds.extend(c)));
    map.fitBounds(bounds, { padding: 60 });

    showCards(fastest, calmest);
    paint(calmest);
    msg.textContent = routes.length + " route option" + (routes.length > 1 ? "s" : "") + " found. Click a card to switch.";
  } catch (err) {
    msg.textContent = "Something went wrong: " + err.message;
  }
}

document.getElementById("go").onclick = () => {
  if (map.loaded()) showRoutes(); else map.once("load", showRoutes);
};
</script>
</body>
</html>
